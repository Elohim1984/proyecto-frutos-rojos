<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakaZita - Frutos Rojos & Antojitos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- Encabezado / Navbar -->
    <header class="bg-rose-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>🍒 PakaZita</span>
            </h1>
            <div class="flex items-center gap-4">
                <button onclick="toggleCarrito()" class="relative bg-rose-700 hover:bg-rose-800 text-white px-4 py-2 rounded-xl transition flex items-center gap-2">
                    🛒 Carrito
                    <span id="cart-count" class="bg-white text-rose-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Nuestro Menú</h2>
            <p class="text-slate-500">Selecciona tus antojitos preferidos y realiza tu pedido al instante.</p>
        </div>

        <!-- Grid de Productos -->
        <div id="productos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full text-center text-slate-400">Cargando productos del servidor...</p>
        </div>
    </main>

    <!-- Sidebar del Carrito (Modal Deslizante) -->
    <div id="carrito-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity">
        <div class="fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col justify-between p-6">
            <div>
                <div class="flex justify-between items-center pb-4 border-b">
                    <h3 class="text-xl font-bold text-slate-900">Tu Pedido</h3>
                    <button onclick="toggleCarrito()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
                </div>
                <div id="carrito-items" class="mt-4 space-y-4 max-h-[58vh] overflow-y-auto">
                    <p class="text-slate-400 text-center py-8">El carrito está vacío.</p>
                </div>
            </div>

            <div class="border-t pt-4 space-y-4">
                <div class="flex justify-between items-center text-lg font-bold text-slate-900">
                    <span>Total:</span>
                    <span id="carrito-total">$0.00</span>
                </div>
                <button onclick="enviarPedido()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    Confirmar y Hacer Pedido
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Funcionalidad -->
    <script>
     const API_URL = "/api";
        let carrito = [];

        // Cargar productos desde la API
        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                const grid = document.getElementById('productos-grid');
                grid.innerHTML = '';

                productos.forEach(p => {
                    grid.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                            <div class="p-5">
                                <div class="w-full h-40 bg-rose-50 rounded-xl mb-4 flex items-center justify-center text-4xl">🍒</div>
                                <h3 class="text-lg font-bold text-slate-800">${p.nombre}</h3>
                                <p class="text-slate-500 text-sm mt-1">${p.descripcion || ''}</p>
                            </div>
                            <div class="p-5 pt-0 flex justify-between items-center border-t border-slate-50 mt-4">
                                <span class="text-xl font-extrabold text-rose-600">$${parseFloat(p.precio).toFixed(2)}</span>
                                <button onclick="agregarAlCarrito(${p.id}, '${p.nombre}', ${p.precio})"
                                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-4 py-2 rounded-xl transition text-sm">
                                    Agregar
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('productos-grid').innerHTML = '<p class="col-span-full text-center text-rose-500 font-medium">Error al conectar con el servidor.</p>';
            }
        }

        function agregarAlCarrito(id, nombre, precio) {
            carrito.push({ id, nombre, precio: parseFloat(precio) });
            actualizarCarrito();
        }

        function actualizarCarrito() {
            document.getElementById('cart-count').innerText = carrito.length;
            const itemsContainer = document.getElementById('carrito-items');
            const totalContainer = document.getElementById('carrito-total');

            if (carrito.length === 0) {
                itemsContainer.innerHTML = '<p class="text-slate-400 text-center py-8">El carrito está vacío.</p>';
                totalContainer.innerText = '$0.00';
                return;
            }

            let total = 0;
            itemsContainer.innerHTML = carrito.map((item, index) => {
                total += item.precio;
                return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <div>
                        <p class="font-bold text-slate-700 text-sm">${item.nombre}</p>
                        <p class="text-rose-600 text-xs font-semibold">$${item.precio.toFixed(2)}</p>
                    </div>
                    <button onclick="eliminarDelCarrito(${index})" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>
                `;
            }).join('');

            totalContainer.innerText = `$${total.toFixed(2)}`;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function toggleCarrito() {
            document.getElementById('carrito-modal').classList.toggle('hidden');
        }

        async function enviarPedido() {
            if (carrito.length === 0) {
                alert('El carrito está vacío');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: carrito })
                });
                const data = await res.json();
                alert(`¡Pedido #${data.pedidoId || 'Registrado'} registrado con éxito!`);
                carrito = [];
                actualizarCarrito();
                toggleCarrito();
            } catch (err) {
                alert('Ocurrió un error al guardar el pedido');
            }
        }

        cargarProductos();
    </script>
</body>
</html>
